<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Iridium">
  <title>Iridium</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/_ir/gate.css">
  <!-- In the head so the saved theme applies before the first paint; the UI waits for DOMContentLoaded. -->
  <script src="/_ir/gate.js"></script>
</head>
<body>
  <main class="shell">
    <div class="card">
      <h1 class="brand">Iridium</h1>

      <section id="v-wait" class="view">
        <span class="spinner" role="progressbar"></span>
      </section>

      <section id="v-login" class="view" hidden>
        <button id="login" class="btn" type="button" data-t="signIn"></button>
        <p id="setup" class="note" data-t="setup" hidden></p>
      </section>

      <section id="v-join" class="view" hidden>
        <form id="join-form" novalidate>
          <input id="name" name="name" type="text" autocomplete="off" spellcheck="false" autocapitalize="off"
                 enterkeyhint="go" maxlength="40" data-tp="namePh" aria-describedby="name-note">
          <button id="join" class="btn" type="submit" data-t="create" disabled></button>
        </form>
      </section>

      <section id="v-bad" class="view" hidden>
        <p class="note" data-t="badLink"></p>
      </section>

      <!-- One line kept under the key whatever it says (the name's problem, an error, or nothing),
           so the card never changes size. -->
      <div class="msg">
        <p id="name-note" class="note field-note" aria-live="polite"></p>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
    </div>
  </main>
</body>
</html>
