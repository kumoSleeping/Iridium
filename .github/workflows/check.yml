# The checks, written once: ci.yml runs them for a push to main and a pull request, release.yml
# before it publishes. scripts/preflight.sh runs the same on a clean checkout before a push.
name: check

on:
  workflow_call:
    inputs:
      # Go's caches saved after (main's, which the next runs start from); a tag's own would serve
      # no later tag, so a release restores only.
      save-cache:
        type: boolean
        default: false

permissions:
  contents: read

# The web app and the Go side side by side: the Go tests need no web build (internal/webui serves
# whatever dist holds, built or not).
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The dsh plugin, its own repository since 2026-11-27: the executor some tests run against
      # this side (internal/testagent DSHPlugin).
      - uses: actions/checkout@v4
        with:
          repository: otae-1204/dsh-remote-iridium
          path: .dsh-remote-iridium
      - uses: actions/setup-node@v4 # the node executor under test
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # Go's build and module caches, by go.mod and go.sum; when those change, the last one saved
      # is a start (setup-go's own cache had none: everything built again, the job three times as long).
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: types
        run: scripts/check-types.sh
      - name: vet
        run: |
          go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: test
        env:
          IRIDIUM_DSH_PLUGIN: ${{ github.workspace }}/.dsh-remote-iridium
        run: go test ./...
      - uses: actions/cache/save@v4
        if: inputs.save-cache && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
