# A tag v* builds the release: the web app embedded, one static binary per platform packed as
# iridium-<os>-<arch>.tar.gz, the desktop app's downloads (iridium-app-*: the binary on Linux and
# Windows, Iridium.app zipped on macOS, made and signed on a Mac), SHA256SUMS, and the notes: the
# commits, then the sizes. `ir update` and the
# settings page read the latest release (internal/update).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# All at once: the checks, Linux's and Windows' builds (one runner each), and macOS's on a Mac,
# which bundles and signs the app there too. publish waits for all and puts their files together
# (scripts/release.sh finish). One runner building every platform took about three and a half
# minutes, and the Mac waited for it.
jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    strategy:
      matrix:
        include:
          - os: linux
            platforms: linux/amd64 linux/arm64
          - os: windows
            platforms: windows/amd64 windows/arm64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4 # the modules at least (the release's builds are -trimpath)
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run build:app
      - name: build
        env:
          VERSION: ${{ github.ref_name }}
          PLATFORMS: ${{ matrix.platforms }}
          COMPUTER_PLATFORMS: ${{ matrix.platforms }}
        run: scripts/release.sh "$VERSION" dist build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist
          retention-days: 1

  # macOS's binaries, built on a Mac, then Iridium.app around them, signed whole (ad hoc) with
  # codesign. A release goes out without the app if that step fails, never without the binaries.
  mac:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # a tag's cache serves no later tag
      - name: web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run build:app
      - name: build
        env:
          VERSION: ${{ github.ref_name }}
          PLATFORMS: darwin/arm64 darwin/amd64
          COMPUTER_PLATFORMS: darwin/arm64 darwin/amd64
          TAR: gtar # the runner's GNU tar: the archives as Linux's (a Mac's own tar has no --owner)
        run: |
          command -v gtar >/dev/null || brew install gnu-tar
          scripts/release.sh "$VERSION" dist build
      - name: bundle
        continue-on-error: true
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/app-bundle.sh "$VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-mac
          path: dist
          retention-days: 1

  publish:
    needs: [check, build, mac]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes are the commits since the last tag
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          scripts/release.sh "$VERSION" dist finish
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$VERSION" dist/*.tar.gz dist/iridium-app-* dist/ir-computer-* dist/install.sh dist/install.ps1 dist/SHA256SUMS \
            --title "$VERSION" --notes-file dist/notes.md $pre
      # The dsh plugin went to npm here at Iridium's version, through v0.2.54. Since 2026-11-27 it
      # is a repository of its own (github.com/otae-1204/dsh-remote-iridium), published from there.
